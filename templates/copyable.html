const SYMBOLS=[["Sun","☀︎"],["Cloud","☁︎"],["Wave","〜"],["Spark","✳︎"],["Half moon","◑"],["Bloom","✿"]];
const SONGS=["Here Comes the Sun \u2014 The Beatles", "Lovely Day \u2014 Bill Withers", "Three Little Birds \u2014 Bob Marley & The Wailers", "Dog Days Are Over \u2014 Florence + The Machine"];

const STEPS=[
 {title:"Before we begin",short:"Check in",icon:"☀︎",description:"Find a color, symbol, or song that says a little about where you are."},
 {title:"Share your perspective",short:"Share",icon:"◫",description:"Step into your character’s shoes. What does the story look like from here?"},
 {title:"Choose a path",short:"Choose",icon:"↗",description:"There’s more than one way forward. Which one feels right to you?"},
 {title:"Notice what shifted",short:"Reflect",icon:"❧",description:"Check in again. Something might have changed. It’s okay if it hasn’t."}
];
function code(){const bytes=new Uint8Array(6);crypto.getRandomValues(bytes);return Array.from(bytes,n=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[n%32]).join("")}
function blank(){return Array.from({length:4},()=>[0,1].map(()=>({mode:"color",choice:"",text:"",drawing:""})))}
function ready(){return Array.from({length:4},()=>[false,false])}
function fresh(){return{page:"home",code:code(),names:["",""],scenario:0,card:0,actor:0,answers:blank(),ready:ready(),handoff:null,modal:null,agreed:false,error:""}}
function Avatar({i}){return <span className={"avatar "+(i?"b":"")} aria-hidden="true">{i?"b":"a"}·</span>}
function Art(){return <div className="art" role="img" aria-label="Two different shapes sharing a space"><span className="bubble one">● I see it this way.</span><svg viewBox="0 0 530 420" fill="none" aria-hidden="true"><path d="M120 60C62 83 51 144 68 197c12 39 8 57-6 94-18 49 8 78 62 83 52 5 113-5 137-51 22-44 1-88-1-128-2-37 17-74-9-105-30-36-86-47-131-30Z" fill="#c5d0b5"/><path d="M354 49c-56-5-93 25-99 80-3 25 0 43-15 58l-21 21c-7 8-3 16 10 19l23 6c3 48-9 89 22 117 28 26 99 20 137-9 33-24 37-60 31-103-6-42-1-56 3-86 9-62-33-98-91-103Z" fill="#ebc0a7"/><path d="M186 136c20-9 32-4 36 2m-20 13v12m105-25c16-9 27-6 34-1m-21 13v12M194 240c14 10 29 8 39-2m56-2c11 8 22 6 30-2" stroke="#404336" strokeWidth="3.5" strokeLinecap="round"/><ellipse cx="176" cy="205" rx="17" ry="9" fill="#adba9a"/><ellipse cx="347" cy="206" rx="17" ry="9" fill="#dda48c"/><path d="M130 314c-8-28-8-54-1-78m3 29-17-9m14 29 19-17" stroke="#7d9169" strokeWidth="2"/><path d="m377 92 5 13 14 1-11 9 3 14-11-8-12 8 4-14-11-9 14-1 5-13Z" stroke="#b3836f"/></svg><span className="bubble two">Oh, I hadn’t thought of that.</span><small>Different views. A little more understanding.</small></div>}
function Dialog({title,close,paused,children}){const ref=useRef(null);useEffect(()=>{const d=ref.current;d.showModal();return()=>{if(d.open)d.close()}},[]);return <dialog ref={ref} className={"modal "+(paused?"paused":"")} aria-labelledby="dialog-title" onCancel={e=>{e.preventDefault();close()}} onClick={e=>{if(e.target===ref.current)close()}}><div className="modalinner"><button className="close" aria-label="Close dialog" onClick={close}>×</button><h2 id="dialog-title">{title}</h2>{children}</div></dialog>}
function Display({a}){let label=a.choice;if(a.mode==="color")label=COLORS.find(x=>x[1]===a.choice)?.[0];if(a.mode==="symbol")label=SYMBOLS.find(x=>x[1]===a.choice)?.[0];return <div className="display">{a.mode==="sketch"?<img src={a.drawing} alt="Participant’s abstract sketch"/>:a.mode==="color"?<span className="swatch" style={{background:a.choice}}/>:a.mode==="symbol"?<span className="symbol">{a.choice}</span>:<span aria-hidden="true">♫</span>}<span>{a.mode==="sketch"?"An original sketch":(a.choiceLabel||label||a.choice)}</span></div>}
function Sketch({value,change}){const ref=useRef(null),down=useRef(false);useEffect(()=>{const ctx=ref.current.getContext("2d");ctx.clearRect(0,0,600,250);if(value){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=value}},[value]);function point(e){const r=ref.current.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*250/r.height]}function start(e){e.preventDefault();down.current=true;ref.current.setPointerCapture(e.pointerId);const ctx=ref.current.getContext("2d"),[x,y]=point(e);ctx.strokeStyle=ctx.fillStyle="#7c6895";ctx.lineWidth=4;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x,y)}function move(e){if(!down.current)return;const ctx=ref.current.getContext("2d");ctx.lineTo(...point(e));ctx.stroke()}function stop(){if(down.current){down.current=false;change(ref.current.toDataURL("image/png"))}}return <div className="pad"><canvas ref={ref} width="600" height="250" onPointerDown={start} onPointerMove={move} onPointerUp={stop} onPointerCancel={stop} aria-label="Draw with a mouse or touch. For keyboard input, choose the Symbol option instead."/><div className="padbar"><span>A shape, a squiggle, anything.</span><button type="button" className="link" onClick={()=>change("")}>Clear drawing</button></div><p className="help">Using a keyboard? The Symbol tab offers an equally expressive option.</p></div>}




function Compare({before,after}){return <div className="compare"><div><small>BEFORE</small><Display a={before}/></div><div><small>NOW</small><Display a={after}/></div></div>}
function App(){
 const[s,set]=useState(fresh),main=useRef(null);const patch=p=>set(old=>({...old,...p}));const inSession=["room","setup","play","summary"].includes(s.page),scenario=SCENARIOS[s.scenario],both=s.ready[s.card].every(Boolean),a=s.answers[s.card][s.actor];
 useEffect(()=>{window.scrollTo({top:0,behavior:"auto"});main.current?.focus()},[s.page,s.card,s.handoff,s.actor]);
 function create(){set({...fresh(),page:"room"})}function end(){set({...fresh(),page:"ended"})}function restart(){patch({page:"setup",card:0,actor:0,answers:blank(),ready:ready(),handoff:null,modal:null,agreed:false,error:""})}
 function namesReady(e){e.preventDefault();const form=e.currentTarget,data=new FormData(form),names=["first","second"].map(n=>String(data.get(n)||"").trim());if(!names[0]||!names[1]){patch({error:"Enter a nickname for each person, or try the demo nicknames below."});form.elements[names[0]?"second":"first"].focus();return}if(names[0].toLowerCase()===names[1].toLowerCase()){patch({error:"Choose two different nicknames so each perspective is easy to follow."});form.elements.second.focus();return}patch({names,page:"setup",error:""})}
 function join(e){e.preventDefault();const value=String(new FormData(e.currentTarget).get("code")||"").trim().toUpperCase();if(value!=="DEMO24"&&value!==s.code){patch({error:"That code isn’t on this device. Use DEMO24 to try a local session."});return}set({...fresh(),page:"room",code:value})}
 function update(p){set(old=>({...old,answers:old.answers.map((pair,c)=>c===old.card?pair.map((answer,i)=>i===old.actor?{...answer,...p}:answer):pair)}))}
 const complete=!!a.text.trim()&&(s.card===1||!!(a.mode==="sketch"?a.drawing:a.choice));
 function submit(e){e.preventDefault();if(!complete)return;if(/\b(idiot|stupid|hate you|shut up|kill|worthless)\b/i.test(a.text)){patch({modal:"warning"});return}const next=s.ready.map(pair=>pair.slice());next[s.card][s.actor]=true;patch({ready:next,handoff:next[s.card].every(Boolean)?null:{to:1-s.actor}})}
 function next(){if(s.card===3)patch({page:"summary"});else{const c=s.card+1;patch({card:c,handoff:s.ready[c].every(Boolean)?null:{to:0}})}}
 function home(){if(inSession)patch({modal:"end"});else patch({page:"home"})}const close=()=>patch({modal:null,error:""});
 return <div className="min-h-screen flex flex-col"><header className="header"><div className="wrap"><button className="brand" onClick={home} aria-label="Two Perspectives home"><span className="brandmark" aria-hidden="true"/>two perspectives.</button><nav className="nav" aria-label="Main navigation">{inSession?<><span className="sessioncode">Session <strong>{s.code}</strong></span><button onClick={()=>patch({modal:"pause"})} aria-label="Take a pause">Ⅱ <span>Take a pause</span></button></>:<><a href="#how-it-works" onClick={s.page!=="home"?e=>{e.preventDefault();patch({page:"home"})}:undefined}>How it works</a><button onClick={()=>patch({modal:"rules"})}>Ground rules</button><span className="pill">● A two-person experience</span></>}</nav></div></header>
 <main ref={main} tabIndex="-1" className="flex-1" style={{outline:0,visibility:s.modal==="paused"?"hidden":"visible"}}>
 {s.page==="home"&&<><section className="hero wrap"><div><span className="eyebrow">✳︎ A LITTLE ROOM FOR ANOTHER VIEW</span><h1>One story.<br/><em>Two perspectives.</em></h1><p>A playful space for two people to step into a story, see it differently, and get a little curious.</p><div className="actions"><button className="btn" onClick={create}>Create a session <span aria-hidden="true">→</span></button><button className="btn outline" onClick={()=>patch({modal:"join",error:""})}>Join a session <span aria-hidden="true">♧</span></button></div><div className="meta">2 people · 10–15 minutes · No right answers</div></div><Art/></section><div className="wrap"><section className="banner"><span aria-hidden="true">❧</span><div><strong>Made-up stories. Real curiosity.</strong><p>This is a fictional experience, not counseling or conflict resolution. Just a new way to see.</p></div></section><section className="journey" id="how-it-works"><div className="sectionhead"><div><span className="eyebrow">A SMALL JOURNEY, TOGETHER</span><h2>Four cards. A fresh perspective.</h2></div><p>You bring the curiosity.<br/>We’ll bring a little structure.</p></div><div className="tiles">{STEPS.map((step,i)=><article className="tile" key={step.title}><div className="tiletop" aria-hidden="true"><span>{step.icon}</span><span>0{i+1}</span></div><h3>{step.title}</h3><p>{step.description}</p></article>)}</div></section><section className="landingnote"><span className="flower" aria-hidden="true">✳︎</span><div><h2>A different view doesn’t have to change yours.</h2><p>No winning. No fixing. No agreement required.</p></div><button className="link" onClick={()=>patch({modal:"rules"})}>A few ground rules →</button></section></div></>}
 {s.page==="room"&&<section className="page wrap"><div className="intro"><span className="eyebrow">PULL UP TWO CHAIRS</span><h1>A little space for the two of you.</h1><p>Choose nicknames, get comfortable, and leave your real names at the door.</p></div><div className="roomgrid"><div className="box codebox"><span className="eyebrow">YOUR TEMPORARY SESSION CODE</span><div className="code">{s.code}</div><div className="qr"><svg width="70" height="70" viewBox="0 0 80 80" fill="none" aria-hidden="true"><path d="M5 5h22v22H5zM53 5h22v22H53zM5 53h22v22H5z" stroke="currentColor" strokeWidth="4"/><path d="M13 13h6v6h-6zM61 13h6v6h-6zM13 61h6v6h-6zM38 5h6v14h-6zM36 27h9v9h-9zM5 37h18v6H5zM30 45h10v20H30zM48 39h13v6H48zM67 35h8v19h-8zM47 53h8v8h-8zM61 63h14v12H61zM45 69h9v6h-9z" fill="currentColor"/></svg>QR placeholder · not scannable</div><p>This local demo is for two people taking turns on one device. Codes do not connect separate devices.</p><p style={{marginTop:20}}>Nothing is saved beyond this session.</p></div><form className="box roomform" onSubmit={namesReady} noValidate><h2>Who’s here?</h2><p className="help" id="names-help">Choose two different nicknames. Next, pick a story and begin the questions.</p>{[0,1].map(i=><div key={i}><label className="field" htmlFor={i?"second":"first"}>Participant {i?"B":"A"} nickname</label><input id={i?"second":"first"} name={i?"second":"first"} maxLength="20" autoComplete="off" defaultValue={s.names[i]} placeholder={i?"Partner’s nickname":"Your nickname"} required aria-describedby={s.error?"names-help names-error":"names-help"}/></div>)}{s.error&&<p className="error" id="names-error" role="alert">{s.error}</p>}<button className="btn full" type="submit">We’re both here →</button><button className="link" type="button" onClick={()=>patch({names:["Moss","Clover"],page:"setup",error:""})}>Just exploring? Try demo nicknames</button><p className="smallnote">Two people. Two perspectives. No real names needed.</p></form></div><button className="link leave" onClick={()=>patch({modal:"end"})}>Leave this session</button></section>}
 {s.page==="setup"&&<section className="page wrap"><div className="intro"><span className="eyebrow">BEFORE WE STEP INSIDE</span><h1>Let’s start with a story.</h1><p>Same moment. Two characters. A different view from each side.</p></div><div className="setupgrid"><div><div className="scenariohead"><strong>Pick your scenario</strong><button className="link" onClick={()=>patch({scenario:(s.scenario+1+Math.floor(Math.random()*(SCENARIOS.length-1)))%SCENARIOS.length})}>Surprise us ↝</button></div>{SCENARIOS.map((item,i)=><button key={item.title} className={"scenario "+(i===s.scenario?"selected":"")} aria-pressed={i===s.scenario} onClick={()=>patch({scenario:i})}><small>{item.category}</small><strong>{item.title}</strong><p>{item.description}</p></button>)}</div><div className="box rulesbox"><span className="flower" aria-hidden="true">✳︎</span><h2>A few things to bring along.</h2><ul><li><strong>Stay in the story.</strong> These are fictional characters, not your own disagreements.</li><li><strong>Be curious, be kind.</strong> Different views can sit side by side.</li><li><strong>You set the pace.</strong> Pause or leave any time. No agreement is required.</li></ul><label className="checklabel"><input type="checkbox" checked={s.agreed} onChange={e=>patch({agreed:e.target.checked})}/><span>We’re here to explore fictional perspectives. This isn’t counseling or conflict resolution.</span></label><button className="btn full" disabled={!s.agreed} onClick={()=>patch({page:"play",card:0,actor:0,handoff:{to:0}})}>Begin with {scenario.title.toLowerCase()} →</button>{!s.agreed&&<p className="help">Check the box above to start the questions.</p>}<button className="link leave" onClick={()=>patch({modal:"end"})}>Leave session</button></div></div></section>}
 {s.page==="play"&&<section className="page wrap"><ol className="progress" aria-label="Conversation progress">{STEPS.map((step,i)=><li key={step.short} className={i===s.card?"current":""} aria-current={i===s.card?"step":undefined}><span>{i<s.card?"✓":"0"+(i+1)}</span>{step.short}</li>)}</ol><div className="playgrid"><aside className="story"><span className="eyebrow">YOUR SHARED STORY</span><h2>{scenario.title}</h2><p>{scenario.story}</p><span className="tag">FICTIONAL SCENARIO</span><div className="statuses" aria-live="polite">{s.names.map((name,i)=><div key={i}><Avatar i={i}/><strong>{name}</strong><small>{s.ready[s.card][i]?"✓ Ready":"Thinking"}</small></div>)}</div></aside><div>
 {s.handoff?<div className="handoff"><Avatar i={s.handoff.to}/><span className="eyebrow">A LITTLE PRIVACY, PLEASE</span><h2>Time for another perspective.</h2><p>Pass the device to <strong>{s.names[s.handoff.to]}</strong>. Responses stay tucked away until you both submit.</p><button className="btn" onClick={()=>patch({actor:s.handoff.to,handoff:null})}>I’m {s.names[s.handoff.to]} →</button><p style={{marginTop:17,fontSize:11}}>Make sure it’s your turn before continuing.</p></div>:both?<div><div className="revealhead"><span className="flower" aria-hidden="true">✳︎</span><span className="eyebrow">BOTH PERSPECTIVES ARE HERE</span><h2>{["Two starting points.","Same story. Different sides.","Two ways forward.","A little room for change."][s.card]}</h2><p>{s.card===2?"Your paths don’t have to match. There’s room for both.":"Take a moment to read each other’s words. Just listen first."}</p></div><div className="pair">{s.names.map((name,i)=><article key={i} className={"personcard "+(i?"purple":"")}><h3><Avatar i={i}/>{name}</h3>{s.card===0?<Display a={s.answers[0][i]}/>:s.card===2?<div className="display"><strong>{s.answers[2][i].choice}</strong></div>:s.card===3?<Compare before={s.answers[0][i]} after={s.answers[3][i]}/>:null}<p className="quote">{s.answers[s.card][i].text}</p></article>)}</div><div className="revealfoot"><p>{s.card===1?"What’s one thing you hadn’t considered?":"Different views can still share a space."}</p><button className="btn" onClick={next}>{s.card===3?"See our reflection":"On to card "+(s.card+2)} →</button></div></div>:<>
 <div className="turns"><span>YOUR TURN</span><div>{s.names.map((name,i)=><button key={i} className={i===s.actor?"active":""} aria-pressed={i===s.actor} onClick={()=>{if(i!==s.actor)patch({handoff:{to:i}})}}>{name}</button>)}</div></div>
 {s.ready[s.card][s.actor]?<div className="handoff"><h2>Your perspective is tucked away.</h2><p>Ready when your partner is.</p><button className="btn" onClick={()=>patch({handoff:{to:1-s.actor}})}>Pass to {s.names[1-s.actor]} →</button></div>:<form className="box answerbox" onSubmit={submit}><div className="personline"><Avatar i={s.actor}/><span>{s.names[s.actor]}’s space</span><small>Only you, for now</small></div><h2>{STEPS[s.card].title}</h2><p className="description">{STEPS[s.card].description}</p>
 {s.card===1&&<div className={"rolecard "+(s.actor?"purple":"")}><span className="eyebrow">YOUR CHARACTER’S PERSPECTIVE · {s.actor?"B":"A"}</span><p>{scenario.views[s.actor]}</p><p className="help">Imagine you’re this person. You don’t have to agree with them.</p></div>}
 {(s.card===0||s.card===3)&&<Picker a={a} update={update} after={s.card===3}/>}
 {s.card===2&&<fieldset style={{border:0,padding:0,margin:0}}><legend className="field">What would you choose for your character?</legend>{PATHS.map(([name,description])=><button key={name} type="button" className={"path "+(a.choice===name?"selected":"")} aria-pressed={a.choice===name} onClick={()=>update({choice:name})}><span><strong>{name}</strong><small>{description}</small></span><span aria-hidden="true">{a.choice===name?"●":"○"}</span></button>)}</fieldset>}
 <label className="field" htmlFor="reflection">{["What does this choice represent for you?","What happened, from your character’s point of view?","Why does this path feel right?","After hearing the other side, what do you notice?"][s.card]}</label><textarea id="reflection" value={a.text} onChange={e=>update({text:e.target.value})} maxLength="1200" required placeholder={s.card===1?"From where I’m standing…":"A few words, in your own way…"}/><div className="count">{a.text.length}/1200</div><div className="submitrow"><p>Revealed only when you both submit.</p><button className="btn" type="submit" disabled={!complete}>I’m ready to share →</button></div></form>}</>}
 </div></div></section>}
 {s.page==="summary"&&<section className="page wrap"><div className="intro"><span className="flower" aria-hidden="true">✳︎</span><span className="eyebrow">A MOMENT TO LOOK BACK</span><h1>Two views. A little more room.</h1><p>You explored <strong>{scenario.title.toLowerCase()}</strong> together. You don’t have to agree for this time to have mattered.</p></div><div className="summary"><div className="pair">{s.names.map((name,i)=><article key={i} className={"personcard "+(i?"purple":"")}><h3><Avatar i={i}/>{name}’s reflection</h3><Compare before={s.answers[0][i]} after={s.answers[3][i]}/>{["Before we began","My character’s perspective","The path I chose","What I noticed"].map((heading,c)=><section key={c}><h4>{heading}{c===2?": "+s.answers[c][i].choice:""}</h4><p className="quote">{s.answers[c][i].text}</p></section>)}</article>)}</div></div><div className="outro"><h2>Curiosity counts. Agreement is optional.</h2><p>Take what you noticed with you. Ending or refreshing clears every response.</p><div className="actions"><button className="btn outline" onClick={()=>patch({modal:"restart"})}>Explore another story</button><button className="btn" onClick={()=>patch({modal:"end"})}>End session →</button></div></div></section>}
 {s.page==="ended"&&<section className="ended wrap"><span className="flower" aria-hidden="true">✳︎</span><span className="eyebrow">THANKS FOR GETTING CURIOUS</span><h1>A little perspective goes a long way.</h1><p>Your session is closed. All responses and nicknames have been cleared.</p><button className="btn" onClick={()=>patch({page:"home"})}>Back to the beginning →</button></section>}
 </main><footer className="footer"><div className="wrap"><span className="footerbrand">two perspectives.</span><span>Just here, just now. No accounts. Nothing saved.</span><span>A fictional experience, made for curiosity.</span></div></footer>
 {s.modal&&<Dialog key={s.modal} close={close} paused={s.modal==="paused"} title={{join:"Your other perspective awaits.",rules:"A few ground rules.",pause:"There’s no rush.",paused:"A little room to breathe.",warning:"A quick wording check.",restart:"Room for a fresh start?",end:"Ready to close this chapter?"}[s.modal]}>
 {s.modal==="join"&&<><p>This prototype works on one device. Try DEMO24, or enter this page’s temporary session code.</p><form onSubmit={join}><label className="field" htmlFor="joincode">Session code</label><input id="joincode" name="code" maxLength="6" minLength="6" required autoComplete="off" placeholder="DEMO24"/>{s.error&&<p className="error" role="alert">{s.error}</p>}<p className="help" style={{marginTop:12}}>Codes do not connect separate devices.</p><div className="actions"><button className="btn full" type="submit">Join local session →</button></div></form></>}
 {s.modal==="rules"&&<><p>A playful classroom prototype for exploring made-up situations together.</p><ul><li><strong>Keep it fictional.</strong> Step into the seeded characters’ shoes instead of using a real disagreement.</li><li><strong>Curiosity over certainty.</strong> Keep your words kind. Neither person needs to change their mind.</li><li><strong>Your pace, your choice.</strong> Pause or leave whenever you like. This is not counseling or conflict resolution.</li><li><strong>Just here, just now.</strong> Responses live in this page’s memory. Refreshing or ending clears them. Same-device hiding is a turn-taking convention, not secure storage.</li></ul><div className="actions"><button className="btn full" onClick={close}>A little curiosity. That’s all.</button></div></>}
 {s.modal==="pause"&&<><p>Take a breath, stretch a little, or put the device down. Your place stays here while this page remains open.</p><div className="actions"><button className="btn" onClick={close}>Keep going →</button><button className="pausechoice" onClick={()=>patch({modal:"paused"})}>Pause and hide responses</button>{s.page==="play"&&s.card>0&&<button className="pausechoice" onClick={()=>patch({card:s.card-1,handoff:null,modal:null})}>Go back a card</button>}<button className="pausechoice" onClick={()=>patch({modal:"restart"})}>Start a fresh story</button><button className="pausechoice" onClick={()=>patch({modal:"end"})}>Leave this session</button></div></>}
 {s.modal==="paused"&&<><div className="center flower" aria-hidden="true">✳︎</div><p>Your session is paused. No timer, no pressure. Come back when you’re both ready.</p><div className="actions"><button className="btn full" onClick={close}>We’re ready to continue</button></div></>}
 {s.modal==="warning"&&<><p>A small keyword check noticed wording that might feel harsh. Could you describe the character’s experience with a little more care?</p><p style={{marginTop:15}}>This is a limited classroom placeholder, not a safety or moderation service.</p><div className="actions"><button className="btn" onClick={close}>Go back and edit</button><button className="btn outline" onClick={()=>patch({modal:"paused"})}>Take a pause</button><button className="link" onClick={()=>patch({modal:"end"})}>Leave session</button></div></>}
 {s.modal==="restart"&&<><p>This clears both people’s responses and lets you choose another scenario. Your nicknames and session code stay.</p><div className="actions"><button className="btn outline" onClick={close}>Keep our place</button><button className="btn" onClick={restart}>Start over →</button></div></>}
 {s.modal==="end"&&<><p>Ending clears both people’s responses, nicknames, and session code. Nothing is saved. You can always begin again.</p><div className="actions"><button className="btn outline" onClick={close}>Stay a little longer</button><button className="btn" onClick={end}>End session →</button></div></>}
 </Dialog>}
 </div>
}
