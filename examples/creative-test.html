:root{font:15px/1.7 Arial,sans-serif;color:#30342d;background:#f8f7f3;--purple:#7c6895;--line:#dedfd4}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a18ab8;outline-offset:3px}header{border-bottom:1px solid var(--line);padding:22px}.wrap{max-width:850px;width:calc(100% - 36px);margin:auto}.brand{font-weight:bold;font-size:21px;letter-spacing:-.5px}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:15px}header small{font-size:10px;letter-spacing:1px;color:#626b55}main{padding:35px 0}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:42px;line-height:1.2;letter-spacing:-1px}h1 em{color:var(--purple)}.intro{margin-bottom:27px}.intro p{color:#636d57;font-size:13px;margin-top:13px}.card{border:1px solid var(--line);border-radius:13px;background:#fffdf9;padding:27px}.card h2{font-size:29px;margin:8px 0 15px}.hint{font-size:12px;color:#626b55}.btn{border:1px solid var(--purple);border-radius:7px;padding:11px 18px;background:var(--purple);color:#fff;font-size:13px;font-weight:bold;min-height:44px}.btn:hover:not(:disabled){background:#68537d}.btn.outline{background:transparent;color:#635272;border-color:#cfc8d7}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.field{display:block;font-size:12px;font-weight:bold;margin:18px 0 6px}input,textarea{display:block;width:100%;border:1px solid #d4d8c9;border-radius:6px;padding:11px 12px;background:#fffefa;color:#30342d}textarea{min-height:105px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.tabs{display:flex;gap:5px;padding:4px;background:#efede7;border-radius:7px;margin:18px 0}.tabs button{flex:1;border:0;border-radius:5px;padding:9px 5px;font-size:12px;background:transparent}.tabs button[aria-pressed=true]{background:#fffdf9;color:#705384}.status{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px;border-radius:7px;border:1px solid #e3dbea;background:#f3edf7;margin-bottom:18px}.status p{font-size:11px;color:#6f587f}.status.fallback{background:#f8f0e4;border-color:#e6d8bf}.status.fallback p{color:#75603b}.link{border:0;background:none;color:#705384;text-decoration:underline;padding:2px;font-size:12px}.choices{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.option{border:1px solid transparent;border-radius:7px;background:none;padding:9px 4px;font-size:11px;display:flex;align-items:center;flex-direction:column;gap:8px;min-width:0}.option span:last-child{overflow-wrap:anywhere}.option[aria-pressed=true]{background:#efe7f5;border-color:#b49bc7}.swatch{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:#30342d;flex-shrink:0}.songs{grid-template-columns:1fr 1fr}.songs .option{text-align:left;align-items:flex-start;padding:13px;border-color:#e3dbea;background:#f7f2fa}.songs .option[aria-pressed=true]{background:#eae0f2;border-color:#b49bc7}.symbol{font-size:31px;line-height:40px}.subtabs{display:flex;gap:20px;margin-bottom:16px}.subtabs button[aria-pressed=true]{font-weight:bold;text-decoration-thickness:2px}canvas{display:block;width:100%;height:auto;touch-action:none;border:1px dashed #b49bc7;border-radius:8px;background:#fbf9fd;cursor:crosshair}.padbar{display:flex;justify-content:space-between;gap:10px;margin-top:8px}.preview{width:140px;height:65px;object-fit:contain;display:block;margin-top:12px;background:white;border:1px solid #e3dbea;border-radius:5px}.person{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;font-size:12px;color:#626b55}.pill{display:inline-block;padding:4px 10px;border:1px solid #dce3d1;border-radius:20px;background:#edf2e6;color:#586747;font-size:11px}.error{padding:10px;border:1px solid #e7caca;border-radius:6px;background:#fbefef;color:#854747;font-size:12px;margin-top:14px}.private{background:#f1ebf6;border-color:#dfd4e9;text-align:center;padding:45px 24px}.private h2{color:#705384}.private p{max-width:420px;margin:auto;font-size:13px;color:#705d7c}.private .actions{justify-content:center}.reveal{background:#eef2e6;border-color:#dce4d0;min-width:0}.reveal:nth-child(2){background:#f2eaf7;border-color:#e4d7ed}.reveal h3{font-size:16px}.quote{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:15px;color:#59664d}.reveal:nth-child(2) .quote{color:#765888}.display{display:flex;align-items:center;gap:12px;margin:18px 0;font-size:13px;overflow-wrap:anywhere}.display img{width:130px;height:65px;object-fit:contain;background:#fff9;border-radius:6px}.footer{border-top:1px solid var(--line);padding:20px;text-align:center;font-size:11px;color:#626b55}.dialog{margin:auto;width:calc(100% - 30px);max-width:420px;border:1px solid #e2decd;border-radius:13px;padding:27px;background:#faf8f3;color:#30342d;max-height:90dvh;overflow:auto}.dialog::backdrop{background:#30352c66;backdrop-filter:blur(4px)}.dialog h2{font-size:28px;margin-bottom:15px}.dialog p{font-size:13px;color:#626b55}.dialog .actions{flex-direction:column}.count{font-size:10px;text-align:right;color:#626b55;margin-top:4px}.boot{max-width:650px;margin:60px auto;padding:24px}.boot p{margin:15px 0}.spacer{margin-top:18px}
@media(max-width:600px){h1{font-size:34px}.card{padding:21px 18px}.two{grid-template-columns:1fr}.choices{gap:4px}.option{font-size:9px}.swatch{width:32px;height:32px}.tabs button{font-size:11px}.status{gap:9px}.status p{font-size:10px}.status .link{font-size:10px;white-space:nowrap}.songs .option{font-size:11px}.brand{font-size:18px}header small{max-width:90px;text-align:right;font-size:8px}.person{font-size:11px}.actions .btn{flex:1}.private .actions .btn{flex:initial}.card h2{font-size:27px}}

<body>
<div id="root"><div class="boot"><h1>Two Perspectives</h1><p>Loading the creative test…</p><p>If this message stays visible, connect to the internet and reopen this file. This edition loads React, Tailwind, and Babel from jsDelivr.</p></div></div>
<noscript>Please enable JavaScript to use this test.</noscript>
<script type="text/babel" data-presets="react">
const {useState,useRef,useEffect}=React;
const API={colors:"https://colormind.io/api/",songs:"https://rss.marketingtools.apple.com/api/v2/us/music/most-played/10/songs.json"};
const COLORS=[{value:"#D9CEEB",label:"Lavender"},{value:"#F1C6AD",label:"Peach"},{value:"#C7D4B9",label:"Sage"},{value:"#ECCF7E",label:"Honey"},{value:"#B5CEDF",label:"Sky"},{value:"#DFA6A5",label:"Rose"}];
const SONGS=["Here Comes the Sun — The Beatles","Lovely Day — Bill Withers","Three Little Birds — Bob Marley & The Wailers","Dog Days Are Over — Florence + The Machine"].map(value=>({value,label:value}));
const SYMBOLS=[{value:"☀︎",label:"Sun"},{value:"☁︎",label:"Cloud"},{value:"〜",label:"Wave"},{value:"✳︎",label:"Spark"},{value:"◑",label:"Half moon"},{value:"✿",label:"Bloom"}];
const blank=()=>({mode:"color",choice:"",label:"",text:"",drawing:""});
const initial=()=>({page:"setup",names:["Moss","Clover"],actor:0,handoff:null,answers:[blank(),blank()],ready:[false,false],error:"",modal:null});

async function fetchCatalog(kind, signal) {
  if (kind === 'songs') {
    return new Promise((resolve, reject) => {
      if (signal?.aborted) {
        reject(new DOMException('Aborted', 'AbortError'));
        return;
      }
      const nonce = Array.from(crypto.getRandomValues(new Uint8Array(8)), n => n.toString(16).padStart(2, '0')).join('');
      const callback = 'twoPerspectivesSongs_' + nonce;
      const script = document.createElement('script');
      let settled = false;
      function finish(error, items) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        script.remove();
        signal?.removeEventListener('abort', abort);
        window[callback] = () => {};
        setTimeout(() => { delete window[callback]; }, 15000);
        if (error) reject(error); else resolve(items);
      }
      const abort = () => finish(new DOMException('Aborted', 'AbortError'));
      const timer = setTimeout(() => finish(new Error('iTunes timed out')), 7000);
      window[callback] = data => {
        try {
          if (!Array.isArray(data.results)) throw new Error('Invalid song list');
          const items = data.results
            .filter(t => typeof t.trackName === 'string' && t.trackName.trim())
            .slice(0, 10)
            .map(t => ({
              value: 'itunes:' + (t.trackId || t.trackName + t.artistName),
              label: t.trackName + (typeof t.artistName === 'string' ? ' — ' + t.artistName : '')
            }));
          const unique = [...new Map(items.map(item => [item.value, item])).values()];
          if (!unique.length) throw new Error('No songs returned');
          finish(null, unique);
        } catch (error) { finish(error); }
      };
      script.onerror = () => finish(new Error('iTunes is unavailable'));
      script.onload = () => { if (!settled) finish(new Error('iTunes did not return song data')); };
      script.referrerPolicy = 'no-referrer';
      script.src = 'https://itunes.apple.com/search?' + new URLSearchParams({
        term: 'feel good', entity: 'song', media: 'music', country: 'us', limit: '10', callback
      });
      signal?.addEventListener('abort', abort, { once: true });
      document.head.appendChild(script);
    });
  }

  const controller = new AbortController();
  const abort = () => controller.abort();
  if (signal?.aborted) controller.abort();
  else signal?.addEventListener('abort', abort, { once: true });
  const timer = setTimeout(abort, 7000);
  try {
    const response = await fetch('https://colormind.io/api/', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({ model: 'default' }),
      credentials: 'omit', referrerPolicy: 'no-referrer', signal: controller.signal
    });
    if (!response.ok) throw new Error('ColorMind is unavailable');
    const json = await response.json();
    if (!Array.isArray(json.result) || json.result.length < 3 || json.result.length > 12) throw new Error('Invalid palette');
    return json.result.map(rgb => {
      if (!Array.isArray(rgb) || rgb.length !== 3 || !rgb.every(n => Number.isInteger(n) && n >= 0 && n <= 255)) throw new Error('Invalid color');
      const value = '#' + rgb.map(n => n.toString(16).padStart(2, '0')).join('').toUpperCase();
      return { value, label: 'Color ' + value };
    });
  } finally {
    clearTimeout(timer);
    signal?.removeEventListener('abort', abort);
  }
}

function SketchPad({value,onChange}){
 const ref=useRef(null),drawing=useRef(false);
 useEffect(()=>{
  const ctx=ref.current.getContext("2d");let disposed=false;
  ctx.clearRect(0,0,600,260);
  if(value){const image=new Image();image.onload=()=>{if(!disposed)ctx.drawImage(image,0,0)};image.src=value}
  return()=>{disposed=true};
 },[value]);
 function point(e){const r=ref.current.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*260/r.height]}
 function start(e){
  if(e.button!==0)return;e.preventDefault();drawing.current=true;ref.current.setPointerCapture(e.pointerId);
  const ctx=ref.current.getContext("2d"),[x,y]=point(e);
  ctx.strokeStyle=ctx.fillStyle="#7c6895";ctx.lineWidth=4;ctx.lineCap=ctx.lineJoin="round";
  ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x,y);
 }
 function move(e){if(!drawing.current)return;const ctx=ref.current.getContext("2d");ctx.lineTo(...point(e));ctx.stroke()}
 function finish(){if(!drawing.current)return;drawing.current=false;onChange(ref.current.toDataURL("image/png"))}
 function clear(){drawing.current=false;ref.current.getContext("2d").clearRect(0,0,600,260);onChange("")}
 return <div><canvas ref={ref} width="600" height="260" onPointerDown={start} onPointerMove={move} onPointerUp={finish} onPointerCancel={finish} onLostPointerCapture={finish} aria-label="Draw with mouse, pen, or touch. Keyboard users can choose a preset symbol instead."/><div className="padbar"><span className="hint">A shape, a squiggle, anything.</span><button type="button" className="link" onClick={clear}>Clear drawing</button></div><p className="hint spacer">For keyboard input, choose a preset symbol.</p>{value&&<img className="preview" src={value} alt="Your drawing preview"/>}</div>;
}

function Modal({title,close,children}){
 const ref=useRef(null);
 useEffect(()=>{const d=ref.current;d.showModal();return()=>{if(d.open)d.close()}},[]);
 return <dialog ref={ref} className="dialog" aria-labelledby="dialog-title" onCancel={e=>{e.preventDefault();close()}} onClick={e=>{if(e.target===ref.current)close()}}><h2 id="dialog-title">{title}</h2>{children}</dialog>;
}

function Display({answer}){
 return <div className="display">{answer.mode==="sketch"?<img src={answer.drawing} alt="Participant’s abstract sketch"/>:answer.mode==="color"?<span className="swatch" style={{background:answer.choice}}/>:answer.mode==="symbol"?<span className="symbol">{answer.choice}</span>:<span aria-hidden="true">♫</span>}<span>{answer.mode==="sketch"?"An original sketch":answer.label||answer.choice}</span></div>;
}

function App(){
 const[s,set]=useState(initial),main=useRef(null);
 const[catalogs,setCatalogs]=useState({colors:{items:COLORS,status:"idle"},songs:{items:SONGS,status:"idle"}});
 const requests=useRef({}),attempted=useRef(new Set());
 const patch=p=>set(old=>({...old,...p}));
 const answer=s.answers[s.actor];
 const kind=answer.mode==="color"?"colors":answer.mode==="song"?"songs":null;
 const both=s.ready.every(Boolean);
 const complete=!!answer.text.trim()&&!!(answer.mode==="sketch"?answer.drawing:answer.choice);
 function update(p){set(old=>({...old,answers:old.answers.map((a,i)=>i===old.actor?{...a,...p}:a)}))}
 async function load(type,retry=false){
  if(requests.current[type]||(attempted.current.has(type)&&!retry))return;
  attempted.current.add(type);const controller=new AbortController();requests.current[type]=controller;
  setCatalogs(old=>({...old,[type]:{...old[type],status:"loading"}}));
  try{
   const items=await fetchCatalog(type,controller.signal);
   if(!controller.signal.aborted)setCatalogs(old=>({...old,[type]:{items,status:"live"}}));
  }catch{
   if(!controller.signal.aborted)setCatalogs(old=>({...old,[type]:{items:type==="colors"?COLORS:SONGS,status:"fallback"}}));
  }finally{if(requests.current[type]===controller)delete requests.current[type]}
 }
 useEffect(()=>{if(s.page==="test"&&s.handoff===null&&!both&&kind)load(kind)},[s.page,s.handoff,s.actor,kind,both]);
 useEffect(()=>()=>{Object.values(requests.current).forEach(c=>c.abort())},[]);
 useEffect(()=>{window.scrollTo({top:0,behavior:"auto"});main.current?.focus()},[s.page,s.handoff,s.actor,both]);
 function reset(){Object.values(requests.current).forEach(c=>c.abort());requests.current={};attempted.current.clear();set(initial());setCatalogs({colors:{items:COLORS,status:"idle"},songs:{items:SONGS,status:"idle"}})}
 function start(e){
  e.preventDefault();const form=e.currentTarget,data=new FormData(form),names=["a","b"].map(key=>String(data.get(key)||"").trim());
  if(names.some(n=>!n)||names[0].toLowerCase()===names[1].toLowerCase()){patch({error:"Enter two different nicknames."});form.elements[names[0]?"b":"a"].focus();return}
  patch({names,page:"test",handoff:0,error:""});
 }
 function mode(next){if(next!==answer.mode)update({mode:next,choice:"",label:"",drawing:""})}
 function submit(e){
  e.preventDefault();if(!complete)return;
  if(/\b(idiot|stupid|hate you|shut up|kill|worthless)\b/i.test(answer.text)){patch({modal:"warning"});return}
  const next=s.ready.slice();next[s.actor]=true;patch({ready:next,handoff:next.every(Boolean)?null:1-s.actor});
 }
 let items=kind?catalogs[kind].items:SYMBOLS;
 if(answer.choice&&!items.some(item=>item.value===answer.choice))items=[{value:answer.choice,label:answer.label||answer.choice},...items];
 const resource=kind?catalogs[kind]:null;
 const image=answer.mode==="symbol"||answer.mode==="sketch";
 return <div className="min-h-screen flex flex-col"><header><div className="wrap"><span className="brand">two perspectives.</span><small>CREATIVE FEATURE TEST</small></div></header>
 <main ref={main} tabIndex="-1" className="wrap flex-1" style={{outline:0,visibility:s.modal==="pause"?"hidden":"visible"}}>
 <div className="intro"><h1>A color. A song.<br/><em>A little of your perspective.</em></h1><p>This focused test checks the updated creative features. Use fictional responses. The full app’s other conversation cards aren’t included here.</p></div>
 {s.page==="setup"?<form className="card" onSubmit={start} noValidate><h2>Who’s here?</h2><p className="hint">Two people take turns on one device. Use nicknames, not real names.</p><div className="two">{[0,1].map(i=><div key={i}><label className="field" htmlFor={i?"nick-b":"nick-a"}>Participant {i?"B":"A"} nickname</label><input id={i?"nick-b":"nick-a"} name={i?"b":"a"} defaultValue={s.names[i]} maxLength="20" required autoComplete="off"/></div>)}</div>{s.error&&<p className="error" role="alert">{s.error}</p>}<div className="actions"><button className="btn" type="submit">We’re both here →</button></div><p className="hint spacer">The sample nicknames are ready to use. Nothing is saved or uploaded.</p></form>
 :both?<><div className="intro"><h2>Two starting points.</h2><p>You both submitted. Now you can see each other’s choices.</p></div><div className="two">{s.names.map((name,i)=><article className="card reveal" key={i}><h3>{name}</h3><Display answer={s.answers[i]}/><p className="quote">{s.answers[i].text}</p></article>)}</div><div className="actions"><button className="btn" onClick={()=>patch({modal:"reset"})}>Start a new test</button><button className="btn outline" onClick={()=>patch({modal:"end"})}>End session</button></div><p className="hint spacer">No agreement required. Ending or refreshing clears every response.</p></>
 :s.page==="ended"?<section className="card"><h2>Your session is closed.</h2><p className="hint">Both participants’ responses and nicknames have been cleared.</p><div className="actions"><button className="btn" onClick={reset}>Start again</button></div></section>
 :s.handoff!==null?<section className="card private"><span className="pill">A LITTLE PRIVACY, PLEASE</span><h2>Pass the device to {s.names[s.handoff]}.</h2><p>Your partner’s draft stays hidden. Both people must submit before anything is revealed.</p><div className="actions"><button className="btn" onClick={()=>patch({actor:s.handoff,handoff:null})}>I’m {s.names[s.handoff]} →</button></div></section>
 :<><div className="person"><span>{s.names.map((name,i)=><span key={i} style={{marginRight:12}}>{name}: {s.ready[i]?"ready":"thinking"}</span>)}</span><button className="link" onClick={()=>patch({modal:"pause"})}>Pause</button></div>
 {s.ready[s.actor]?<section className="card private"><h2>Your response is tucked away.</h2><div className="actions"><button className="btn" onClick={()=>patch({handoff:1-s.actor})}>Pass to {s.names[1-s.actor]}</button></div></section>
 :<form className="card" onSubmit={submit}><div className="person"><span className="pill">{s.names[s.actor]}’s space</span><span>Only you, for now</span></div><h2>Before we begin.</h2><p className="hint">Choose something that represents where you are right now.</p>
 <div className="tabs" aria-label="Expression type"><button type="button" aria-pressed={answer.mode==="color"} onClick={()=>mode("color")}>A color</button><button type="button" aria-pressed={image} onClick={()=>{if(!image)mode("symbol")}}>Image or Symbol</button><button type="button" aria-pressed={answer.mode==="song"} onClick={()=>mode("song")}>A song</button></div>
 {resource&&<div className={"status "+(resource.status==="fallback"?"fallback":"")}><p role="status" aria-live="polite">{resource.status==="idle"||resource.status==="loading"?`Loading ${kind==="colors"?"a ColorMind palette":"iTunes song suggestions"}… Presets are usable while loading.`:resource.status==="live"?kind==="colors"?"Fresh palette from ColorMind.":"Song suggestions from iTunes. These are search results, not a popularity chart.":kind==="colors"?"ColorMind is unavailable. Using preset colors.":"iTunes is unavailable. Showing preset songs."}</p><button className="link" type="button" disabled={resource.status==="idle"||resource.status==="loading"} onClick={()=>load(kind,true)}>{resource.status==="live"?"Refresh":"Try again"}</button></div>}
 {image&&<div className="subtabs"><button className="link" type="button" aria-pressed={answer.mode==="symbol"} onClick={()=>mode("symbol")}>Choose a symbol</button><button className="link" type="button" aria-pressed={answer.mode==="sketch"} onClick={()=>mode("sketch")}>Draw your own</button></div>}
 {answer.mode==="sketch"?<SketchPad value={answer.drawing} onChange={drawing=>update({drawing})}/>:<div className={"choices "+(answer.mode==="song"?"songs":"")} role="group" aria-label={"Choose a "+answer.mode}>{items.map(item=><button key={item.value} type="button" className="option" aria-pressed={answer.choice===item.value} onClick={()=>update({choice:item.value,label:item.label})}>{answer.mode==="color"?<span className="swatch" aria-hidden="true" style={{background:item.value}}>{answer.choice===item.value?"✓":""}</span>:answer.mode==="symbol"?<span className="symbol">{item.value}</span>:<span aria-hidden="true">♫</span>}<span>{item.label}</span></button>)}</div>}
 <label className="field" htmlFor="meaning">What does this choice represent for you?</label><textarea id="meaning" value={answer.text} onChange={e=>update({text:e.target.value})} maxLength="1200" placeholder="A few words, in your own way…" required/><div className="count">{answer.text.length}/1200</div><div className="actions"><button className="btn" type="submit" disabled={!complete}>Submit my choice →</button><button className="btn outline" type="button" onClick={()=>patch({handoff:1-s.actor})}>Switch participant</button></div><p className="hint spacer">Switching hides unfinished responses. Nothing is revealed until both people submit.</p></form>}</>}
 </main><footer className="footer">Fictional scenarios only. Not counseling or conflict resolution. Responses stay in memory and clear on refresh or session end.</footer>
 {s.modal&&<Modal close={()=>patch({modal:null})} title={{pause:"A little room to breathe.",warning:"A quick wording check.",reset:"Start a fresh test?",end:"Close this chapter?"}[s.modal]}>
 {s.modal==="pause"?<><p>Your responses are hidden. Keep this page open to retain your place.</p><div className="actions"><button className="btn" onClick={()=>patch({modal:null})}>Continue</button><button className="btn outline" onClick={()=>patch({modal:"reset"})}>Restart test</button><button className="link" onClick={()=>patch({modal:"end"})}>Leave session</button></div></>
 :s.modal==="warning"?<><p>A simple keyword check noticed potentially harsh wording. This is a demo placeholder, not a moderation service.</p><div className="actions"><button className="btn" onClick={()=>patch({modal:null})}>Go back and edit</button><button className="btn outline" onClick={()=>patch({modal:"pause"})}>Take a pause</button><button className="link" onClick={()=>patch({modal:"end"})}>Leave session</button></div></>
